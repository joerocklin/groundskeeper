refresh_zones:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper

add_plan:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper
    zone:
      required: true
      example: "Front lawn"
      selector:
        text:
    start_height_mm:
      required: true
      selector:
        number:
          min: 0
          max: 200
          unit_of_measurement: mm
    end_height_mm:
      required: true
      selector:
        number:
          min: 0
          max: 200
          unit_of_measurement: mm
    max_cut_pct:
      required: false
      selector:
        number:
          min: 5
          max: 33
          unit_of_measurement: "%"
    base_angle:
      required: false
      selector:
        number:
          min: -90
          max: 90
          unit_of_measurement: "°"
    finishing:
      required: false
      selector:
        boolean:
    settings:
      required: false
      example: '{"spacing_cm": 25, "perimeter_laps": 1}'
      selector:
        object:
    start:
      required: false
      default: false
      selector:
        boolean:
    position:
      required: false
      default: end
      selector:
        select:
          translation_key: position
          options:
            - end
            - front

remove_plan:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper
    plan_id:
      required: true
      selector:
        text:

start:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper

cancel:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper

retry_run:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper

skip_plan:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper

answer_prompt:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper
    prompt_id:
      required: true
      selector:
        text:
    action:
      required: true
      example: retry
      selector:
        text:

pause:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper

stop_now:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper

resume:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper

resume_run:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper

end_run:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper

wet_grass_done_today:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper

dismiss_anomaly:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper
    detector:
      required: true
      example: charge_not_rising
      selector:
        select:
          options:
            - charge_not_rising
            - run_too_long
          translation_key: anomaly_detector

export_config:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: groundskeeper
    include_history:
      required: false
      default: false
      selector:
        boolean:
