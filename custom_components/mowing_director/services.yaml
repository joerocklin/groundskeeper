refresh_zones:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mowing_director

add_plan:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mowing_director
    zone:
      required: true
      example: "Front lawn"
      selector:
        text:
    start_height_mm:
      required: true
      selector:
        number:
          min: 0
          max: 200
          unit_of_measurement: mm
    end_height_mm:
      required: true
      selector:
        number:
          min: 0
          max: 200
          unit_of_measurement: mm
    start:
      required: false
      default: false
      selector:
        boolean:

start:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mowing_director

cancel:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mowing_director

retry_run:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mowing_director

skip_plan:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mowing_director

answer_prompt:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mowing_director
    prompt_id:
      required: true
      selector:
        text:
    action:
      required: true
      example: retry
      selector:
        text:
